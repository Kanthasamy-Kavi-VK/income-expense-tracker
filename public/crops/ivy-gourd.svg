<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ivyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="ivyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.16" />
    </filter>
  </defs>
  <!-- Leaves / vine curl in background -->
  <path d="M40 30 Q60 20 85 28 T130 22" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" />
  <path d="M125 22 C135 15, 142 30, 132 35 C122 38, 120 28, 128 25" fill="none" stroke="#15803d" stroke-width="2" />
  <!-- Gourd 1 (Back, tilted) -->
  <g transform="rotate(-30 65 75)" filter="url(#shadow)">
    <rect x="42" y="45" width="46" height="85" rx="23" fill="url(#ivyGrad1)" />
    <!-- White broken stripes characteristic of tindora -->
    <path d="M54 52 Q53 87 55 122" stroke="#dcfce7" stroke-width="2" stroke-dasharray="4,3" fill="none" opacity="0.8" />
    <path d="M65 50 Q65 87 65 125" stroke="#f0fdf4" stroke-width="2.5" stroke-dasharray="5,3" fill="none" opacity="0.9" />
    <path d="M76 52 Q77 87 75 122" stroke="#dcfce7" stroke-width="2" stroke-dasharray="4,3" fill="none" opacity="0.8" />
    <!-- Stem -->
    <path d="M65 45 Q66 35 70 30" stroke="#15803d" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
  <!-- Gourd 2 (Front, slightly tilted other way) -->
  <g transform="rotate(20 95 85)" filter="url(#shadow)">
    <rect x="72" y="50" width="48" height="88" rx="24" fill="url(#ivyGrad2)" />
    <!-- White broken stripes -->
    <path d="M84 58 Q83 94 85 130" stroke="#dcfce7" stroke-width="2.2" stroke-dasharray="4,3" fill="none" opacity="0.8" />
    <path d="M96 55 Q96 94 96 132" stroke="#ffffff" stroke-width="2.8" stroke-dasharray="5,3" fill="none" opacity="0.95" />
    <path d="M108 58 Q109 94 107 130" stroke="#dcfce7" stroke-width="2.2" stroke-dasharray="4,3" fill="none" opacity="0.8" />
    <!-- Stem cap -->
    <path d="M96 50 Q94 38 90 32" stroke="#15803d" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
